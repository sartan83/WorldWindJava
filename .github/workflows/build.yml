name: Build

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ant, Ant JUnit and Xvfb
        run: sudo apt-get update && sudo apt-get install -y ant ant-optional xvfb

      - name: Build and test
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ant -f release-build.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results
